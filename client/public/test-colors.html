<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Test</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#fffbeb', 100: '#fef3c7', 200: '#fde68a', 300: '#fcd34d',
              400: '#fbbf24', 500: '#f59e0b', 600: '#d97706', 700: '#b45309',
              800: '#92400e', 900: '#78350f',
            },
            surface: {
              50: '#f8fafc', 100: '#f1f5f9', 200: '#e2e8f0', 300: '#cbd5e1',
              400: '#94a3b8', 500: '#64748b', 600: '#475569', 700: '#334155',
              800: '#1e293b', 900: '#0f172a', 950: '#020617',
            },
          }
        }
      }
    }
  </script>
</head>
<body class="bg-surface-900 min-h-screen p-8">
  <h1 class="text-4xl text-white mb-4">White text</h1>
  <h2 class="text-3xl text-brand-400 mb-4">Brand-400 text</h2>
  <p class="text-xl text-surface-300 mb-4">Surface-300 text</p>
  <p class="text-xl text-surface-400 mb-4">Surface-400 text</p>
  <p class="text-xl text-surface-500 mb-4">Surface-500 text</p>
  <p class="text-xl text-surface-600 mb-4">Surface-600 text</p>
  <div class="bg-brand-500 text-white p-4 rounded">White on brand-500</div>
</body>
</html>
